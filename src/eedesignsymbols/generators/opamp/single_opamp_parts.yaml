# Single op-amp pinout shapes. One entry per shape, not per part: many real
# manufacturer part numbers can share one exact pinout, and none of them
# names the symbol. A librarian edits this file directly to add, change, or
# remove a shape; the generator makes no decision of its own. See
# single.py's module docstring for the "code" naming rule and config.py for
# the pin-slot schema.
#
# Every pin slot on _OPAMP_SINGLE_SYMGEN_TEMPLATE is listed below by its own
# name: "+", "-", OUT, "V+", "V-" (always required), and EN, "~{EN}",
# FB_OUT, PAD, NC (omit any of these five to delete that pin).
#
# Control direction follows the logic level that enables the op-amp:
# high enables: point up, using EN; low enables: point down, using "~{EN}".
# Active-high enable and active-low disable therefore point up.
# Active-low enable and active-high disable therefore point down.
# Preserve the manufacturer name independently of this direction.
# A part uses at most one control slot.
#
# Template slots "+" and "-" generate as "IN+" and "IN-".
# Only "number" is required for these slots.
# Descriptions use IN+ and IN-. The output always uses OUT.
# All other names match the manufacturer, including case and overbars.
# Control-slot selection describes enable behavior, not the printed name.
#
# "description" is one sentence stating what a shape adds over the bare
# five pins. The generator appends the exact kept-pin list after it, so
# this must not repeat that list itself.
#
# "name_text_size" is optional on any pin. Omitted means the template's own
# size for that pin. Given, it overrides the size for that one pin on that
# one output row only; it never touches the template or any other row.
# Value is millimeters (KiCad's own unit here); 40 mils is 1.016.

parts:
  # Example part numbers below are the smallest real, real-datasheet source
  # each pin number/name pairing was confirmed against, not a claim that
  # this row belongs to that part alone.

  - code: 5P_PINOUT01
    previous_names: [OPAMP_SINGLE_5p_SYMGEN, OPAMP_SINGLE_5p_PINOUT01_SYMGEN]
    description: Single op-amp
    # e.g. AD8031BRZ
    pins:
      "+": {number: "3"}
      "-": {number: "2"}
      OUT: {name: OUT, number: "6"}
      "V+": {name: "+VS", number: "7"}
      "V-": {name: "-VS", number: "4"}

  - code: 5P_PINOUT02
    previous_names: [OPAMP_SINGLE_5p_PINOUT02_SYMGEN]
    description: Single op-amp
    # TSOT-23, top view.
    pins:
      "+": {number: "3"}
      "-": {number: "4"}
      OUT: {name: OUT, number: "1"}
      "V+": {name: "V+", number: "5"}
      "V-": {name: "V-", number: "2"}

  - code: 6P_PINOUT01
    previous_names: [OPAMP_SINGLE_6p_nSHDN_SYMGEN, OPAMP_SINGLE_6p_PINOUT01_SYMGEN]
    description: Single op-amp
    # e.g. LT1806IS6
    pins:
      "+": {number: "3"}
      "-": {number: "4"}
      OUT: {name: OUT, number: "1"}
      "V+": {name: "V+", number: "6"}
      "V-": {name: "V-", number: "2"}
      "EN": {name: "~{SHDN}", number: "5"}

  - code: 6P_PINOUT02
    previous_names: [OPAMP_SINGLE_6p_nEN_SYMGEN, OPAMP_SINGLE_6p_PINOUT02_SYMGEN]
    description: Single op-amp
    # LT6230CS6#TRPBF. The datasheet shows an overbar on ENABLE. Low enables.
    pins:
      "+": {number: "3"}
      "-": {number: "4"}
      OUT: {name: OUT, number: "1"}
      "V+": {name: "V+", number: "6"}
      "V-": {name: "V-", number: "2"}
      "~{EN}": {name: "~{ENABLE}", number: "5"}

  - code: 6P_PINOUT03
    previous_names: [OPAMP_SINGLE_6p_EN_SYMGEN, OPAMP_SINGLE_6p_PINOUT03_SYMGEN]
    description: Single op-amp
    # e.g. OPA355, OPA373
    pins:
      "+": {number: "3"}
      "-": {number: "4"}
      OUT: {name: OUT, number: "1"}
      "V+": {name: "V+", number: "6"}
      "V-": {name: "V-", number: "2"}
      EN: {name: ENABLE, number: "5"}

  - code: 6P_PINOUT04
    previous_names: [OPAMP_SINGLE_6p_nDIS_SYMGEN, OPAMP_SINGLE_6p_PINOUT04_SYMGEN]
    description: Single op-amp
    # e.g. OPA690
    pins:
      "+": {number: "3"}
      "-": {number: "4"}
      OUT: {name: OUT, number: "1"}
      "V+": {name: "+VS", number: "6"}
      "V-": {name: "-VS", number: "2"}
      "EN": {name: "~{DIS}", number: "5"}

  - code: 6P_PINOUT05
    previous_names: [OPAMP_SINGLE_6p_nSD_SYMGEN, OPAMP_SINGLE_6p_PINOUT05_SYMGEN]
    description: Single op-amp
    # LT1637CS8, datasheet 1637fd, pages 2 and 12: SHDN is high to disable.
    pins:
      "+": {number: "3"}
      "-": {number: "2"}
      OUT: {name: OUT, number: "6"}
      "V+": {name: "V+", number: "7"}
      "V-": {name: "V-", number: "4"}
      "~{EN}": {name: "SHDN", number: "5"}

  - code: 8P_PINOUT01
    previous_names: [OPAMP_SINGLE_8p_nSHDN_2xNC_SYMGEN, OPAMP_SINGLE_8p_PINOUT01_SYMGEN]
    description: Single op-amp
    # e.g. LTC6268IS8#TRPBF
    pins:
      "+": {number: "3"}
      "-": {number: "2"}
      OUT: {name: OUT, number: "6"}
      "V+": {name: "V+", number: "7"}
      "V-": {name: "V-", number: "5"}
      "EN": {name: "~{SHDN}", number: "8"}
      NC: {name: NC, number: ["1", "4"], electrical_type: no_connect}

  - code: 9P_PINOUT01
    previous_names: [OPAMP_SINGLE_9p_nPD_FB_PADpwr_NC_SYMGEN, OPAMP_SINGLE_9p_PINOUT01_SYMGEN]
    description: >-
      Single op-amp
    # ADA4857-1YCPZ-R7, LFCSP, Rev. D, pages 3, 7 and 21.
    # PD is high to disable, without a bar. EP uses footprint pad number 9.
    # Supply subscripts use plain text.
    pins:
      "+": {number: "4"}
      "-": {number: "3"}
      OUT: {name: OUT, number: "7"}
      "V+": {name: "+VS", number: "8"}
      "V-": {name: "-VS", number: "5"}
      "~{EN}": {name: "PD", number: "1"}
      FB_OUT: {name: FB, number: "2"}
      PAD: {name: EP, number: "9", electrical_type: power_in}
      NC: {name: NC, number: "6", electrical_type: no_connect}

  - code: 5P_PINOUT03
    previous_names: [OPAMP_SINGLE_5p_PINOUT03_SYMGEN]
    description: Single op-amp
    # MCP6001. DS20001733L, pin table. VSS is not GND.
    pins:
      "+": {number: "3"}
      "-": {number: "4"}
      OUT: {number: "1"}
      "V+": {name: VDD, number: "5"}
      "V-": {name: VSS, number: "2"}

  - code: 5P_PINOUT04
    previous_names: [OPAMP_SINGLE_5p_PINOUT04_SYMGEN]
    description: Single op-amp
    # MIC922, pin configuration.
    pins:
      "+": {number: "1"}
      "-": {number: "3"}
      OUT: {number: "4"}
      "V+": {name: "V+", number: "5"}
      "V-": {name: "V-", number: "2"}

  - code: 5P_PINOUT05
    previous_names: [OPAMP_SINGLE_5p_PINOUT05_SYMGEN]
    description: Single op-amp
    # OPA656 SOT-23. Supply subscripts use plain-text VS.
    pins:
      "+": {number: "3"}
      "-": {number: "4"}
      OUT: {number: "1"}
      "V+": {name: "+VS", number: "5"}
      "V-": {name: "-VS", number: "2"}

  - code: 6P_PINOUT07
    previous_names: [OPAMP_SINGLE_6p_PINOUT07_SYMGEN]
    description: Single op-amp
    # OPA358. ENABLE is high to enable.
    pins:
      "+": {number: "1"}
      "-": {number: "3"}
      OUT: {number: "4"}
      "V+": {name: "V+", number: "6"}
      "V-": {name: GND, number: "2"}
      EN: {name: ENABLE, number: "5"}

  - code: 6P_PINOUT08
    previous_names: [OPAMP_SINGLE_6p_PINOUT08_SYMGEN]
    description: Single op-amp
    # OPA847. Functional pins only. NC pins 1 and 5 are absent.
    pins:
      "+": {number: "3"}
      "-": {number: "2"}
      OUT: {number: "6"}
      "V+": {name: "+VS", number: "7"}
      "V-": {name: "-VS", number: "4"}
      EN: {name: "~{DIS}", number: "8"}

  - code: 8P_PINOUT02
    previous_names: [OPAMP_SINGLE_8p_PINOUT02_SYMGEN]
    description: Single op-amp
    # ADA4857-1 SOIC. PD is high to disable.
    pins:
      "+": {number: "3"}
      "-": {number: "2"}
      OUT: {number: "6"}
      "V+": {name: "+VS", number: "7"}
      "V-": {name: "-VS", number: "4"}
      "~{EN}": {name: PD, number: "8"}
      FB_OUT: {name: FB, number: "1"}
      NC: {name: NC, number: "5", electrical_type: no_connect}
