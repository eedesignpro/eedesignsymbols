[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eedesignsymbols"
dynamic = ["version"]
description = "Generate KiCad symbols from template drawings, one symbol per pin ordering"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

# Pinned exactly, not ranged. A generator's output must be reproducible, and
# the eedesigncore version is the largest input to that. eedesigncore is the
# published name of kicad-file-io. Moving this pin is an explicit, reviewable change.
#
# The library rules package that the internal library route needs is not a
# dependency. That route installs it separately. See README.md, "Install".
dependencies = ["eedesigncore==0.38.0", "PyYAML>=6.0.2,<7"]

[project.urls]
Homepage = "https://github.com/eedesignpro/eedesignsymbols"
Repository = "https://github.com/eedesignpro/eedesignsymbols"
Changelog = "https://github.com/eedesignpro/eedesignsymbols/blob/main/CHANGELOG.md"
Issues = "https://github.com/eedesignpro/eedesignsymbols/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.11.11",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "build==1.3.0",
    "types-PyYAML==6.0.12.20250516",
]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/eedesignsymbols"]

# Named explicitly so `python -m build` does not ship context/ or .claude/, which
# hatchling would otherwise include by default. Security finding Low 7,
# iteration 3 review. Mirrors how kicad-file-io scopes its own sdist.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "VERSION", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "scripts", "tests"]

# `tests/` carries no __init__.py, deliberately: conftest.py records that a test
# module must not depend on being importable by name. Without these two settings
# mypy names a test module by its basename, so the `tests.*` override below never
# matches. `src` comes first so a package module stays `eedesignsymbols.x` rather
# than `src.eedesignsymbols.x`.
mypy_path = "src:."
explicit_package_bases = true

# Annotation discipline is not what a test needs; catching wrong API use is.
# Three flags are relaxed and no others, so a wrong attribute on a library model
# inside a test is still an error. ADR-042.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

# The internal library route crosses two model libraries with the same classes:
# eedesigncore, which the generators use, and kicad-file-io 0.11.2, which the
# internal rules package uses. Its
# tests hand objects of one to functions typed for the other. Each test checks the
# result at run time, so the argument type check is off for these tests only.
[[tool.mypy.overrides]]
module = "tests.klms_route.*"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=eedesignsymbols --cov-report=term-missing"
